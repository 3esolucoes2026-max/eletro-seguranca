# Servidor principal - aceita qualquer host (IP ou dominio)
# O dominio real e configurado no painel do EasyPanel (aba Domains),
# que faz o proxy reverso e emite o certificado HTTPS automaticamente.
server {
    listen 80;
    server_name 3eeletrotecnica.com.br www.3eeletrotecnica.com.br _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao expor a versao do Nginx
    server_tokens off;

    # Deflate (Gzip)
    gzip on;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # HTML sempre revalidado (evita servir versao antiga apos deploy)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache de arquivos estáticos versionaveis
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # Robots e Sitemap
    location = /robots.txt { log_not_found off; }
    location = /sitemap.xml { log_not_found off; }

    # Roteamento de SPA / fallback para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Negar acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
